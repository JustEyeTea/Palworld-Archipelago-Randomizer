# On every push and pull request: the APWorld against the Archipelago version it targets (Archipelago's own test
# suites and test generations), and the mod's C++ part built on Windows, packaged with the Lua mod as an artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apworld:
    name: APWorld on Archipelago ${{ matrix.archipelago }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        archipelago: ["0.6.8"]  # the APWorld's minimum_ap_version (the current release)
    steps:
      - uses: actions/checkout@v7
        with:
          path: palworld-archipelago
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Archipelago ${{ matrix.archipelago }}
        run: |
          git clone --depth 1 --branch "${{ matrix.archipelago }}" https://github.com/ArchipelagoMW/Archipelago.git archipelago
          python -m venv archipelago/.venv
          archipelago/.venv/bin/pip install -q -r archipelago/requirements.txt -r archipelago/WebHostLib/requirements.txt pytest pytest-subtests
      - name: Archipelago's test suites
        run: AP_DIR="$GITHUB_WORKSPACE/archipelago" palworld-archipelago/tools/ap_tests.sh
      - name: Test generations
        env:
          AP_DIR: ${{ github.workspace }}/archipelago
        run: |
          cd palworld-archipelago
          tools/test_generate.sh 3
          EXTRA_OPTIONS='tower_count: 8' tools/test_generate.sh 2
          EXTRA_OPTIONS=$'area_locks: false\n  progressive_spheres: false\n  level_checks: every_10' tools/test_generate.sh 2

  # The mod's C++ part (APConnector), built on Windows against the UE4SS the game runs: Okaetsu's Palworld build,
  # release 2281fa31. UE4SS's Unreal headers live in a private repository that only Epic-linked GitHub accounts can
  # read; UEPSEUDO_TOKEN is used only to clone it here and is never written to the build output.
  cppmod:
    name: C++ mod (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      UE4SS_COMMIT: 2281fa311e417b1dfddedbcd49972d764fddb244   # Okaetsu/RE-UE4SS release 2281fa31
      APCLIENTPP_COMMIT: 6b28cc1781006deae0e28c61752d11a83819585a
      WSWRAP_COMMIT: aeba7ac428028723fb26ce92488f260660f786b1
      SOECLIENT_COMMIT: 9bba4e1ce9fc10500813e9570329daf1dffdf606  # its vendored asio, websocketpp and json
    steps:
      - uses: actions/checkout@v7
        with:
          path: palworld-archipelago
      - name: Fetch UE4SS source
        shell: bash
        env:
          UEPSEUDO_TOKEN: ${{ secrets.UEPSEUDO_TOKEN }}
        run: |
          if [ -z "$UEPSEUDO_TOKEN" ]; then echo "::error::UEPSEUDO_TOKEN secret is missing"; exit 1; fi
          # Submodules use SSH URLs; route them through HTTPS with the token (global config of this runner only).
          git config --global url."https://x-access-token:${UEPSEUDO_TOKEN}@github.com/".insteadOf "git@github.com:"
          dir=palworld-archipelago/cppmod/RE-UE4SS
          git init -q "$dir" && cd "$dir"
          git remote add origin https://github.com/Okaetsu/RE-UE4SS.git
          git fetch -q --depth 1 origin "$UE4SS_COMMIT" && git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
          git config --global --unset url."https://x-access-token:${UEPSEUDO_TOKEN}@github.com/".insteadOf
      - name: Fetch apclientpp and its header-only dependencies
        shell: bash
        run: |
          deps=palworld-archipelago/cppmod/deps; mkdir -p "$deps"
          fetch() { git init -q "$deps/$1" && git -C "$deps/$1" remote add origin "https://github.com/$2.git" &&
                    git -C "$deps/$1" fetch -q --depth 1 origin "$3" && git -C "$deps/$1" checkout -q FETCH_HEAD; }
          fetch apclientpp black-sliver/apclientpp "$APCLIENTPP_COMMIT"
          fetch wswrap black-sliver/wswrap "$WSWRAP_COMMIT"
          fetch ap-soeclient black-sliver/ap-soeclient "$SOECLIENT_COMMIT"
      - name: OpenSSL and zlib (static, dynamic CRT)
        shell: bash
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install openssl:x64-windows-static-md zlib:x64-windows-static-md
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake -S palworld-archipelago/cppmod -B build -G Ninja -DCMAKE_BUILD_TYPE=Game__Shipping__Win64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DAP_DEPS="$GITHUB_WORKSPACE/palworld-archipelago/cppmod/deps" \
            2>&1 | tee build.log
          cmake --build build --target APConnector 2>&1 | tee -a build.log
      # Job logs need admin rights to read, but annotations are public: publish the build's errors as one.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          errs=$( (grep -E 'error|Error|FAILED|CMake Error' build.log || tail -60 build.log) | grep -v 'error_code\|Werror' | head -60)
          echo "::error title=C++ build failed::$(printf '%s' "$errs" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
      - name: Package
        shell: bash
        run: |
          out=package/ue4ss/Mods
          mkdir -p "$out/APConnector/dlls"
          cp "$(find build -name APConnector.dll | head -1)" "$out/APConnector/dlls/main.dll"
          curl -sSfL -o "$out/APConnector/cacert.pem" https://curl.se/ca/cacert.pem   # Mozilla's CA bundle (MPL 2.0)
          cp -r palworld-archipelago/mod/PalworldArchipelago "$out/"
          ls -R package
      - uses: actions/upload-artifact@v6
        with:
          name: PalworldArchipelago-mod-${{ github.sha }}
          path: package
